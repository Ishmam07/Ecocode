spring.application.name=scheduler
# Railway injects PORT at runtime; falls back to 8080 for local dev.
server.port=${PORT:8080}

# ---- MySQL datasource ----
# Locally (no env vars set) this falls back to localhost:3306/ecocode.
# On Railway, add the "MySQL" plugin — it auto-injects MYSQLHOST/MYSQLPORT/
# MYSQLDATABASE/MYSQLUSER/MYSQLPASSWORD, which override these defaults.
spring.datasource.url=jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:ecocode}?createDatabaseIfNotExist=true
spring.datasource.username=${MYSQLUSER:root}
spring.datasource.password=${MYSQLPASSWORD:${DB_PASSWORD:root}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ddl-auto=update -> Hibernate creates/updates the tasks table automatically.
# Fine for a hackathon; use a migration tool (Flyway/Liquibase) for real production use.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ---- Groq (LLM) API config ----
# Set the real key as an env var (Railway: Variables tab -> GROQ_API_KEY).
# NEVER commit the real key here.
groq.api.key=${GROQ_API_KEY:}
groq.api.url=https://api.groq.com/openai/v1/chat/completions
groq.model=llama-3.3-70b-versatile
groq.max-tokens=1500

# ---- OpenAQ (real air quality data) config ----
# Set the real key as an env var (Railway: Variables tab -> OPENAQ_API_KEY).
openaq.api.key=${OPENAQ_API_KEY:}
openaq.api.url=https://api.openaq.org/v3

# ---- Scheduler tuning (matches the blueprint) ----
scheduler.node-a-load-pct=92
scheduler.node-b-load-pct=40
scheduler.node-c-load-pct=15
scheduler.batchable-threshold=30
scheduler.co2-kg-per-kwh=0.233

logging.level.com.ecocode.scheduler=INFO